<!doctype html><html lang="pl"><head><meta charset="utf-8"><title>Logowanie moderacji</title><link rel="stylesheet" href="../style.css"></head><body><main class="admin-panel"><h1>Panel moderacji</h1><p>Zaloguj się aby zarządzać eventami.</p><input id="login" placeholder="Login"><input id="pass" type="password" placeholder="Hasło"><button onclick="login()">Zaloguj</button><p id="msg"></p></main><script>async function login(){const l=document.getElementById('login').value;const p=document.getElementById('pass').value;if(l&&p){sessionStorage.setItem('farymvp_admin_session','ok');location.href='index.html'}else document.getElementById('msg').innerText='Podaj dane';}</script></body></html>
