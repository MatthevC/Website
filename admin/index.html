<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><title>Dodaj event</title><link rel="stylesheet" href="../style.css"></head>
<body><main class="container">
<h1>Administrator - EVENTY</h1>
<form id="eventForm">
<label>Nazwa eventu<input name="title" required></label>
<label>Data rozpoczęcia<input name="date" type="date" required></label>
<label>Data zakończenia<input name="endDate" type="date" required></label>
<label>Opis<textarea name="content" required></textarea></label>
<label>Grafika URL<input name="image" placeholder="np. pictures/events/event.png"></label>
<button>NOWY EVENT</button>
</form>
<p id="msg"></p>
<button onclick="logout()">Wyloguj</button>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase.js"></script>
<script src="auth.js"></script>
<script src="admin.js"></script>
</body></html>
